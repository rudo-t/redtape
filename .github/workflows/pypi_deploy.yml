name: PyPI deploy
on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build redtape
        run: uv build
      - name: Publish redtape to PyPI
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
